name: Publish GHCR fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/astroabyss/gridwise-llm:7d589eb
            ghcr.io/astroabyss/gridwise-llm:7d589eb5c274cb44d92c02bcc8d3b9bc868ffa67
          labels: |
            org.opencontainers.image.source=https://github.com/Astr0Abyss/BUP_Hackathon
